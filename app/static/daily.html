<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日の空 - ADS-B Analytics</title>
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' https: data:; worker-src 'self' blob:;"
>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/icons/favicon-32.png">
<meta name="theme-color" content="#080B10">
</head>
<body data-page="daily">
<div class="app app-shell">

  <nav class="app-nav" aria-label="ページ">
    <a href="/">ダッシュボード</a>
    <a href="/static/daily.html" aria-current="page">今日の空</a>
    <a href="/static/receiver.html">受信性能</a>
    <a href="/static/fullmap.html">航跡地図</a>
    <a href="/static/globe.html">3D航跡</a>
    <a href="/static/history.html">機体履歴</a>
    <a href="/static/rawdata.html">生データ</a>
    <a href="/static/settings.html">設定</a>
  </nav>

  <main class="page-content">

  <header class="app-header">
    <div class="app-header__intro">
      <span class="app-header__eyebrow">Daily brief</span>
      <div class="app-header__title">
        <h1>今日の空</h1>
        <span class="app-header__version" id="app-version"></span>
      </div>
    </div>
    <div class="app-header__updated">
      対象日: <time id="summary-day">--</time>
    </div>
  </header>

  <section class="status-cards metrics-strip" aria-label="今日の状況">
    <div class="card">
      <div class="card__label">ユニーク機数</div>
      <div class="card__value" id="card-unique">--</div>
    </div>
    <div class="card">
      <div class="card__label">最大同時受信数</div>
      <div class="card__value" id="card-concurrent">--</div>
    </div>
    <div class="card">
      <div class="card__label">メッセージ数</div>
      <div class="card__value" id="card-messages">--</div>
    </div>
    <div class="card">
      <div class="card__label">位置取得最大数</div>
      <div class="card__value" id="card-position-max">--</div>
    </div>
  </section>

  <p class="traffic-deltas" id="daily-deltas" aria-live="polite"></p>

  <section class="main-area layout--single">
    <div class="panel panel--chart">
      <div class="panel__header" id="aircraft-type-heading">機種別 機数 (Top10)</div>
      <div id="aircraft-type-chart" class="chart-container" role="img" aria-labelledby="aircraft-type-heading"></div>
      <div id="aircraft-type-chart-error" class="panel__error" hidden></div>
      <p class="panel__empty" id="aircraft-type-empty" hidden>
        機種データはまだありません(adsb-daily-rollupが未実行の機体は集計対象外です)
      </p>
    </div>
  </section>

  <section class="bottom-area daily-records" aria-label="今日のランキング">
    <div class="panel">
      <div class="panel__header">最遠</div>
      <div class="daily-highlight" id="highlight-farthest">--</div>
    </div>
    <div class="panel">
      <div class="panel__header">最接近</div>
      <div class="daily-highlight" id="highlight-closest">--</div>
    </div>
    <div class="panel">
      <div class="panel__header">最多観測</div>
      <div class="daily-highlight" id="highlight-most-observed">--</div>
    </div>
    <div class="panel">
      <div class="panel__header">最高速度</div>
      <div class="daily-highlight" id="highlight-fastest">--</div>
    </div>
    <div class="panel">
      <div class="panel__header">最高高度</div>
      <div class="daily-highlight" id="highlight-highest">--</div>
    </div>
  </section>

  <section class="main-area layout--split">
    <div class="panel">
      <div class="panel__header">本日初観測の機体</div>
      <div class="table-scroll" tabindex="0" role="region" aria-label="本日初観測の機体一覧">
      <table class="ranking-table" id="first-seen-today">
        <caption class="sr-only">今日はじめて観測した機体</caption>
        <thead>
          <tr>
            <th scope="col">機体</th>
            <th scope="col">初観測時刻</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      </div>
      <p class="panel__empty" id="first-seen-today-empty" hidden>今日はまだ新規機体はありません</p>
    </div>
    <div class="panel panel--chart">
      <div class="panel__header" id="trend-heading">直近7日間のユニーク機数トレンド</div>
      <div id="trend-chart" class="chart-container chart-container--compact" role="img" aria-labelledby="trend-heading"></div>
      <div id="trend-chart-error" class="panel__error" hidden></div>
    </div>
  </section>

  <footer class="app-footer">
    <span>ADS-B Analytics</span>
  </footer>

  </main>

</div>

<script src="/static/js/vendor/echarts/echarts.min.js"></script>
<script src="/static/js/shell.js" defer></script>
<script type="module" src="/static/js/daily.js"></script>
</body>
</html>
