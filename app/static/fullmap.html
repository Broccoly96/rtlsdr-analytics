<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>航跡地図 - ADS-B Analytics</title>
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: ws: wss:; font-src 'self' https: data:; worker-src 'self' blob:;"
>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/icons/favicon-32.png">
<meta name="theme-color" content="#080B10">
<link rel="stylesheet" href="/static/js/vendor/maplibre-gl/maplibre-gl.css">
</head>
<body data-page="fullmap">
<div class="app app-shell app-shell--workspace">

  <nav class="app-nav" aria-label="ページ">
    <a href="/">ダッシュボード</a>
    <a href="/static/daily.html">今日の空</a>
    <a href="/static/receiver.html">受信性能</a>
    <a href="/static/fullmap.html" aria-current="page">航跡地図</a>
    <a href="/static/globe.html">3D航跡</a>
    <a href="/static/history.html">機体履歴</a>
    <a href="/static/rawdata.html">生データ</a>
    <a href="/static/settings.html">設定</a>
  </nav>

  <main class="page-content workspace">

  <header class="app-header">
    <div class="app-header__intro">
      <span class="app-header__eyebrow">Live airspace</span>
      <div class="app-header__title">
        <h1>航跡地図</h1>
        <span class="app-header__version" id="app-version"></span>
      </div>
    </div>
    <div class="app-header__period" role="group" aria-label="表示モード">
      <button type="button" data-mode="live" class="period-btn" aria-pressed="true">ライブ</button>
      <div class="globe-history-slider">
        <label for="history-hours-slider">過去</label>
        <input
          type="range"
          id="history-hours-slider"
          class="range-slider"
          min="1"
          max="72"
          step="1"
          value="6"
        >
        <span id="history-hours-value">6H</span>
      </div>
    </div>
    <div class="app-header__period" role="group" aria-label="表示機体" id="live-controls">
      <div class="globe-picker-wrapper">
        <button type="button" id="aircraft-picker-toggle" class="period-btn" aria-expanded="false">
          機体選択 ▾
        </button>
        <div class="globe-picker" id="aircraft-picker" hidden>
          <div class="globe-picker__header">
            <button type="button" id="aircraft-picker-all" class="globe-picker__link">すべて表示</button>
            <button type="button" id="aircraft-picker-none" class="globe-picker__link">すべて非表示</button>
          </div>
          <div class="globe-picker__list" id="aircraft-picker-list"></div>
        </div>
      </div>
      <button type="button" id="aircraft-refresh" class="period-btn">一覧更新</button>
      <button type="button" id="fast-mode-toggle" class="period-btn" aria-pressed="false">更新頻度: 1秒</button>
      <button type="button" id="exit-isolate" class="period-btn" hidden>全機体表示に戻す</button>
    </div>
  </header>

  <details class="workspace__help">
    <summary>使い方</summary>
    <p>
      「ライブ」表示中は現在受信中の全機体を機種カテゴリ別のアイコン（高度帯で色分け）で表示し、
      各機体の過去の軌跡とライブ延伸中の軌跡も重ねて表示します。機体を選ぶと詳細を確認できます。
      「機体選択」で表示対象を絞り込み、スライダーで最大72時間の過去の航跡へ切り替えられます。
    </p>
  </details>

  <section class="main-area layout--single workspace__canvas">
    <div class="panel panel--map panel--workspace">
      <div id="map" class="map-container map-container--full" role="img" aria-label="航跡地図"></div>
      <div id="altitude-legend" class="altitude-legend"></div>
      <div id="map-error" class="panel__error" hidden></div>
    </div>
  </section>

  </main>

</div>

<script src="/static/js/shell.js" defer></script>
<script type="module" src="/static/js/fullmap.js"></script>
</body>
</html>
