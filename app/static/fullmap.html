<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フルスクリーン地図 - ADS-B Analytics</title>
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' https: data:; worker-src 'self' blob:;"
>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/js/vendor/maplibre-gl/maplibre-gl.css">
</head>
<body>
<div class="app">

  <nav class="app-nav" aria-label="ページ">
    <a href="/">ダッシュボード</a>
    <a href="/static/receiver.html">受信性能</a>
    <a href="/static/daily.html">今日の空</a>
    <a href="/static/history.html">機体履歴</a>
    <a href="/static/fullmap.html" aria-current="page">フルスクリーン地図</a>
    <a href="/static/rawdata.html">生データ</a>
    <a href="/static/globe.html">3D航跡</a>
    <a href="/static/settings.html">設定</a>
  </nav>

  <header class="app-header">
    <div class="app-header__title">
      <h1>航跡地図</h1>
      <span class="app-header__version" id="app-version"></span>
    </div>
    <div class="app-header__period" role="group" aria-label="航跡表示期間">
      <button type="button" data-hours="1" class="period-btn">1h</button>
      <button type="button" data-hours="6" class="period-btn" aria-pressed="true">6h</button>
      <button type="button" data-hours="24" class="period-btn">24h</button>
    </div>
  </header>

  <section class="main-area" style="grid-template-columns: 1fr;">
    <div class="panel panel--map">
      <div id="map" class="map-container map-container--full" role="img" aria-label="航跡地図"></div>
      <div id="map-error" class="panel__error" hidden></div>
    </div>
  </section>

</div>

<script type="module" src="/static/js/fullmap.js"></script>
</body>
</html>
