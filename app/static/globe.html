<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D航跡 - ADS-B Analytics</title>
<!--
  script-src includes 'unsafe-eval' on this page ONLY (same precedent as
  receiver.html's echarts-gl chart): CesiumJS's own top-level script
  eagerly compiles WebAssembly (and, separately, uses a plain string-eval
  path) for its terrain/imagery decoding -- without this, those calls
  throw CSP violations *during* Cesium.js's own script execution, which
  aborts partway through and leaves `window.Cesium` undefined entirely
  (confirmed by reproducing the exact failure). Same disclosure as
  receiver.html: this app never uses eval()/Function() itself and never
  renders API/user data as HTML, so the realistic added risk is narrow,
  but it's a real loosening of this page's CSP.
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: ws: wss:; font-src 'self' https: data:; worker-src 'self' blob:;"
>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/icons/favicon-32.png">
<meta name="theme-color" content="#080B10">
<link rel="stylesheet" href="/static/js/vendor/cesium/Widgets/widgets.css">
</head>
<body data-page="globe">
<div class="app app-shell app-shell--workspace">

  <nav class="app-nav" aria-label="ページ">
    <a href="/">ダッシュボード</a>
    <a href="/static/daily.html">今日の空</a>
    <a href="/static/receiver.html">受信性能</a>
    <a href="/static/fullmap.html">航跡地図</a>
    <a href="/static/globe.html" aria-current="page">3D航跡</a>
    <a href="/static/history.html">機体履歴</a>
    <a href="/static/rawdata.html">生データ</a>
    <a href="/static/settings.html">設定</a>
  </nav>

  <main class="page-content workspace">

  <header class="app-header">
    <div class="app-header__intro">
      <span class="app-header__eyebrow">Spatial view</span>
      <div class="app-header__title">
        <h1>3D航跡</h1>
        <span class="app-header__version" id="app-version"></span>
      </div>
    </div>
    <div class="app-header__period" role="group" aria-label="表示モード">
      <button type="button" data-mode="live" class="period-btn" aria-pressed="true">ライブ</button>
      <div class="globe-history-slider">
        <label for="history-hours-slider">過去</label>
        <input
          type="range"
          id="history-hours-slider"
          class="range-slider"
          min="0.25"
          max="24"
          step="0.25"
          value="6"
        >
        <span id="history-hours-value">6.0H</span>
      </div>
    </div>
    <div class="app-header__period" role="group" aria-label="表示機体" id="live-controls">
      <div class="globe-picker-wrapper">
        <button type="button" id="aircraft-picker-toggle" class="period-btn" aria-expanded="false">
          機体選択 ▾
        </button>
        <div class="globe-picker" id="aircraft-picker" hidden>
          <div class="globe-picker__header">
            <button type="button" id="aircraft-picker-all" class="globe-picker__link">すべて表示</button>
            <button type="button" id="aircraft-picker-none" class="globe-picker__link">すべて非表示</button>
          </div>
          <div class="globe-picker__list" id="aircraft-picker-list"></div>
        </div>
      </div>
      <button type="button" id="aircraft-refresh" class="period-btn">一覧更新</button>
      <button type="button" id="follow-toggle" class="period-btn" aria-pressed="false">カメラ自動追従</button>
      <button type="button" id="fast-mode-toggle" class="period-btn" aria-pressed="false">更新頻度: 1秒</button>
      <button type="button" id="exit-isolate" class="period-btn" hidden>全機体表示に戻す</button>
    </div>
  </header>

  <details class="workspace__help">
    <summary>使い方とデータ提供元</summary>
    <p>
      <a href="https://www.esri.com" target="_blank" rel="noopener noreferrer">Esri</a>などの衛星画像を背景に、
      機体と航跡を高度別に色分けして表示します。クリックで詳細、Shift+クリックで単一機体に絞り込みます。
      スライダーでは最大24時間の過去航跡に切り替えられます。ドラッグで回転、スクロールでズームできます。
      この画面の表示データはサーバーに保存されません。
    </p>
  </details>

  <section class="main-area layout--single workspace__canvas">
    <div class="panel panel--workspace">
      <div id="cesium-container" class="globe-container"></div>
      <div id="altitude-legend" class="altitude-legend"></div>
      <div id="globe-tooltip" class="globe-tooltip" hidden></div>
      <div id="globe-error" class="panel__error" hidden></div>
    </div>
  </section>

  <footer class="app-footer">
    <span>ADS-B Analytics</span>
  </footer>

  </main>

</div>

<script src="/static/js/cesium-base-url.js"></script>
<script src="/static/js/vendor/cesium/Cesium.js"></script>
<script src="/static/js/shell.js" defer></script>
<script type="module" src="/static/js/globe.js"></script>
</body>
</html>
