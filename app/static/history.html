<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機体履歴 - ADS-B Analytics</title>
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' https: data:; worker-src 'self' blob:;"
>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">

  <nav class="app-nav" aria-label="ページ">
    <a href="/">ダッシュボード</a>
    <a href="/static/daily.html">今日の空</a>
    <a href="/static/receiver.html">受信性能</a>
    <a href="/static/fullmap.html">航跡地図</a>
    <a href="/static/globe.html">3D航跡</a>
    <a href="/static/history.html" aria-current="page">機体履歴</a>
    <a href="/static/rawdata.html">生データ</a>
    <a href="/static/settings.html">設定</a>
  </nav>

  <header class="app-header">
    <div class="app-header__title">
      <h1>機体履歴</h1>
      <span class="app-header__version" id="app-version"></span>
    </div>
  </header>

  <section class="panel" id="detail-panel" hidden>
    <div class="panel__header">
      機体詳細
      <a href="/static/history.html" class="csv-link">一覧に戻る</a>
    </div>
    <div id="detail-content"></div>
  </section>

  <section class="panel" aria-label="最頻観測機体">
    <div class="panel__header">
      最頻観測機体
      <div class="chart-controls">
        <div class="granularity-controls" role="group" aria-label="集計期間">
          <button type="button" data-days="7" class="period-btn frequent-period-btn" aria-pressed="false">7日</button>
          <button type="button" data-days="30" class="period-btn frequent-period-btn" aria-pressed="true">30日</button>
          <button type="button" data-days="90" class="period-btn frequent-period-btn" aria-pressed="false">90日</button>
        </div>
        <label class="favorites-filter">
          <input type="checkbox" id="favorites-only">
          お気に入りのみ
        </label>
      </div>
    </div>
    <table class="ranking-table" id="ranking-frequent">
      <caption class="sr-only">直近N日間で最も多く観測された機体</caption>
      <thead>
        <tr>
          <th scope="col">お気に入り</th>
          <th scope="col">機体</th>
          <th scope="col">観測日数</th>
          <th scope="col">総パス数</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p class="panel__empty" hidden>データがありません</p>
  </section>

  <footer class="app-footer">
    <span>ADS-B Analytics</span>
  </footer>

</div>

<script type="module" src="/static/js/history.js"></script>
</body>
</html>
