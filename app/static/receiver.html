<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受信性能 - ADS-B Analytics</title>
<!--
  script-src includes 'unsafe-eval' on this page ONLY (every other page
  stays without it): echarts-gl's internal shader/expression compiler
  throws "Invalid expression" and the 3D chart fails to render without
  it -- confirmed by reproducing the exact failure locally with this
  page's CSP and fixing it by adding 'unsafe-eval', nothing else changed.
  This app never uses eval()/Function() itself and never renders
  API/user data as HTML (always textContent, never innerHTML), so the
  realistic added risk is narrow, but it's a real loosening of this
  page's CSP and worth knowing about if you're auditing it.
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' https: data:; worker-src 'self' blob:;"
>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">

  <nav class="app-nav" aria-label="ページ">
    <a href="/">ダッシュボード</a>
    <a href="/static/receiver.html" aria-current="page">受信性能</a>
    <a href="/static/daily.html">今日の空</a>
    <a href="/static/history.html">機体履歴</a>
    <a href="/static/fullmap.html">フルスクリーン地図</a>
    <a href="/static/rawdata.html">生データ</a>
    <a href="/static/globe.html">3D航跡</a>
  </nav>

  <header class="app-header">
    <div class="app-header__title">
      <h1>受信性能</h1>
      <span class="app-header__version" id="app-version"></span>
    </div>
    <div class="app-header__period" role="group" aria-label="集計期間">
      <button type="button" data-hours="24" class="period-btn" aria-pressed="true">24h</button>
      <button type="button" data-hours="168" class="period-btn">7日</button>
      <button type="button" data-hours="720" class="period-btn">30日</button>
    </div>
  </header>

  <section class="main-area">
    <div class="panel panel--chart">
      <div class="panel__header" id="bearing-heading">方位別受信距離</div>
      <div id="bearing-chart" class="chart-container" role="img" aria-labelledby="bearing-heading"></div>
      <div id="bearing-chart-error" class="panel__error" hidden></div>
    </div>
    <div class="panel panel--chart">
      <div class="panel__header" id="altitude-heading">高度帯別受信距離</div>
      <div id="altitude-chart" class="chart-container" role="img" aria-labelledby="altitude-heading"></div>
      <div id="altitude-chart-error" class="panel__error" hidden></div>
    </div>
  </section>

  <section class="main-area">
    <div class="panel panel--chart" style="grid-column: 1 / -1;">
      <div class="panel__header" id="reception-heading">メッセージ数・位置取得率の推移</div>
      <div id="reception-chart" class="chart-container" role="img" aria-labelledby="reception-heading"></div>
      <div id="reception-chart-error" class="panel__error" hidden></div>
    </div>
  </section>

  <section class="main-area">
    <div class="panel panel--chart" style="grid-column: 1 / -1;">
      <div class="panel__header" id="rssi-heading">距離別受信強度(RSSI)ヒートマップ</div>
      <div id="rssi-chart" class="chart-container" role="img" aria-labelledby="rssi-heading"></div>
      <div id="rssi-chart-error" class="panel__error" hidden></div>
    </div>
  </section>

  <section class="main-area">
    <div class="panel panel--chart" style="grid-column: 1 / -1;">
      <div class="panel__header" id="hemisphere-heading">受信範囲 3D表示(方位・仰角・距離)</div>
      <div id="hemisphere-chart" class="chart-container" role="img" aria-labelledby="hemisphere-heading" style="height: 480px;"></div>
      <div id="hemisphere-chart-error" class="panel__error" hidden></div>
      <p class="panel__empty" style="padding: 4px;">
        ドラッグで視点を回転できます。中心が受信局、点の位置が方位・仰角・最大受信距離、色が距離を表します。
      </p>
    </div>
  </section>

  <footer class="app-footer">
    <span>ADS-B Analytics</span>
  </footer>

</div>

<script src="/static/js/vendor/echarts/echarts.min.js"></script>
<script src="/static/js/vendor/echarts-gl/echarts-gl.min.js"></script>
<script type="module" src="/static/js/receiver.js"></script>
</body>
</html>
