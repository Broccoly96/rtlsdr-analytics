<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定 - ADS-B Analytics</title>
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' https: data:; worker-src 'self' blob:;"
>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/icons/favicon-32.png">
<meta name="theme-color" content="#080B10">
</head>
<body data-page="settings">
<div class="app app-shell">

  <nav class="app-nav" aria-label="ページ">
    <a href="/">ダッシュボード</a>
    <a href="/static/daily.html">今日の空</a>
    <a href="/static/receiver.html">受信性能</a>
    <a href="/static/fullmap.html">航跡地図</a>
    <a href="/static/globe.html">3D航跡</a>
    <a href="/static/history.html">機体履歴</a>
    <a href="/static/rawdata.html">生データ</a>
    <a href="/static/settings.html" aria-current="page">設定</a>
  </nav>

  <main class="page-content">

  <header class="app-header">
    <div class="app-header__intro">
      <span class="app-header__eyebrow">Preferences</span>
      <div class="app-header__title">
        <h1>設定</h1>
        <span class="app-header__version" id="app-version"></span>
      </div>
    </div>
  </header>

  <section class="main-area layout--single settings-grid">
    <div class="panel setting-group">
      <div class="panel__header">表示単位</div>
      <p class="setting-group__description">
        この端末のブラウザにのみ保存されます(サーバーには送信されません)。
        既に開いているタブには反映されません -- 再読み込みしてください。
      </p>

      <div class="setting-field">
        <div class="field-label">距離の単位</div>
        <div class="app-header__period segmented-control" role="group" aria-label="距離の単位" id="distance-unit-group">
          <button type="button" data-value="km" class="period-btn">キロメートル (km)</button>
          <button type="button" data-value="nm" class="period-btn">海里 (nm)</button>
        </div>
      </div>

      <div class="setting-field">
        <div class="field-label">高度の単位</div>
        <div class="app-header__period segmented-control" role="group" aria-label="高度の単位" id="altitude-unit-group">
          <button type="button" data-value="ft" class="period-btn">フィート (ft)</button>
          <button type="button" data-value="m" class="period-btn">メートル (m)</button>
        </div>
      </div>
    </div>

    <div class="panel setting-group">
      <div class="panel__header">3D航跡</div>
      <p class="setting-group__description">
        この端末のブラウザにのみ保存されます(サーバーには送信されません)。
        既に開いているタブには反映されません -- 再読み込みしてください。
      </p>
      <div class="setting-field">
        <label for="track-opacity-slider" class="field-label">
          航跡ラインの透明度: <span id="track-opacity-value">50%</span>
        </label>
        <input
          type="range"
          id="track-opacity-slider"
          class="range-slider"
          min="0"
          max="100"
          step="5"
          value="50"
        >
      </div>
    </div>
  </section>

  <footer class="app-footer">
    <span>ADS-B Analytics</span>
  </footer>

  </main>

</div>

<script src="/static/js/shell.js" defer></script>
<script type="module" src="/static/js/settings.js"></script>
</body>
</html>
