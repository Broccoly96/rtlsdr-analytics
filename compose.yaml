# adsb-db never publishes a port to the host -- it is reachable only on the
# internal Docker network. Never add a `ports:` mapping to it.
#
# adsb-collector and adsb-api both reach the host's readsb through
# host.docker.internal, added explicitly via extra_hosts since this is
# Docker Engine on Linux, not Docker Desktop (which provides that
# hostname automatically): adsb-collector for aircraft.json (confirmed
# read-only via `ss -ltn`), adsb-api for the raw-data page's Beast-format
# TCP relay (app/api/routers/rawdata.py). READSB_AIRCRAFT_URL in .env
# must point at host.docker.internal, not 127.0.0.1 -- from inside a
# container, 127.0.0.1 means the container itself.

services:
  adsb-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - adsb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adsb-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      adsb-db:
        condition: service_healthy
    restart: "no"

  adsb-collector:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "app.collector"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      adsb-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adsb-retention:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "app.retention", "--loop"]
    env_file: .env
    depends_on:
      adsb-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adsb-daily-rollup:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "app.dailyrollup", "--loop"]
    env_file: .env
    depends_on:
      adsb-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Shares app.dailyrollup's image but runs independently on a much
  # shorter cadence -- see app/aircraft_lookup.py's module docstring for
  # why this was split out of the once-a-day rollup cycle.
  adsb-type-lookup:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "app.aircraft_lookup", "--loop", "--interval-minutes", "15"]
    env_file: .env
    depends_on:
      adsb-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adsb-api:
    build:
      context: .
      dockerfile: Dockerfile
      # Populates the git-revision suffix next to the version number
      # (see app/version.py, CLAUDE.md's Versioning section) -- omit and
      # it silently falls back to "unknown", not an error, so builds
      # without this still work, just without a revision suffix.
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
    command: ["uvicorn", "app.api.asgi:app", "--host", "0.0.0.0", "--port", "8088"]
    env_file: .env
    ports:
      - "${APP_BIND_HOST}:${APP_PORT}:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      adsb-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  adsb-db-data:
