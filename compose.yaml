# adsb-db + adsb-migrate only (Milestone B scope). adsb-collector/adsb-api
# are added in Milestone F once they're containerized.
#
# adsb-db never publishes a port to the host -- it is reachable only on the
# internal Docker network. Never add a `ports:` mapping to it.

services:
  adsb-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - adsb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adsb-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      adsb-db:
        condition: service_healthy
    restart: "no"

volumes:
  adsb-db-data:
