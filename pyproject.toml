[project]
name = "adsb-analytics"
version = "0.12.1"
description = "Personal ADS-B history and analytics dashboard built on top of readsb."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "asyncpg==0.31.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
migrate = [
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.8.3",
    "playwright==1.61.0",
    "pillow==12.3.0",
    "adsb-analytics[migrate]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
